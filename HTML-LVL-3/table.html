<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table In HTML</title>
</head>

<body>
    <table border="black">
        <!-- thead -->
        <thead>
            <caption>Food Menu</caption>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <!-- tbody -->
        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Samosa</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>25</td>
            </tr>
        </tbody>

    </table>
</body>

</html>
