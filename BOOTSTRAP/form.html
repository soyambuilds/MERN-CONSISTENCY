<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <div class="container">
        <h2>Form Demo</h2>
        <form>

            <div class="row">
                <div class="mb-3 col-md-6">
                    <label class="form-label" for="email">Email</label>
                    <input type="text" placeholder="Email" class="form-control" id="email">
                </div>
                <div class="mb-3 col-md-6">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" placeholder="Password" class="form-control" id="password">
                </div>
            </div>





            <!-- <div class="mb-3">
                <label class="form-label" for="address">Address</label>
                <input type="text" placeholder="Address" class="form-control-sm" id="address">
            </div> -->

            <div class="mb-3">
                <select class="form-select">
                    <option selected>Choose your city</option>
                    <option value="one">Mumbai</option>
                    <option value="two">Delhi</option>
                    <option value="three">Canada</option>
                </select>
            </div>

            <div class="normal mb-3">

                <input type="checkbox" id="agree">
                <label for="agree">Agree</label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="agreebs">
                <label for="agreebs" class="form-check-label">Agree</label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" id="radiobs">
                <label for="radiobs" class="form-check-label">Yes/No</label>
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
