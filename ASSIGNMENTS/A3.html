<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>
</head>

<body>
    <div>
        <table border="1">
            <caption>Student Information</caption>
            <tr>
                <th rowspan="6">Info</th>
                <th rowspan="2">Name</th>
                <th colspan="2">Address</th>
            </tr>
            <tr>
                <th>City</th>
                <th>House</th>
            </tr>


            <tr>
                <td>A</td>
                <td>Delhi</td>
                <td>1</td>
            </tr>
            <tr>
                <td>B</td>
                <td>Mumbai</td>
                <td>2</td>
            </tr>
            <tr>
                <td>C</td>
                <td>Kolkata</td>
                <td>3</td>
            </tr>
            <tr>
                <td>D</td>
                <td>Pune</td>
                <td>4</td>
            </tr>

        </table>
    </div>
    <hr>
    <div>
        <form action="/server">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="username">
            </div>
            <br>
            <div>
                <span>Sex:</span>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
            </div>
            <br>
            <div>
                <label for="country">Country:</label>
                <select name="country" id="country">
                    <option selected>Select an option</option>
                    <option value="india">India</option>
                    <option value="nepal">Nepal</option>
                    <option value="usa">USA</option>
                    <option value="canada">Canada</option>
                </select>
            </div>
            <br>
            <div>
                <label for="message">Message:</label>
                <br>
                <textarea name="msg" id="message" rows="5" cols="30"></textarea>
            </div>
            <br>
            <div>
                <input type="checkbox" id="sub" name="subscribe">
                <label for="sub">Subscribe?</label>
            </div>
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>
    <hr>
    <div>
        <form action="/server">
            <h3>Feedback Form</h3>
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="username" placeholder="Write your name">
            </div>
            <br>
            <div>
                <label for="mail">Email:</label>
                <input type="email" id="mail" name="mail" placeholder="Write your email">
            </div>
            <br>
            <div>
                <label for="msg">Message:</label>
                <br>
                <textarea name="message" id="msg" rows="4" cols="30"></textarea>
            </div>
            <br>
            <div>
                <div>Rate us our of 5:</div>
                <input type="radio" name="rating" id="one" value="one">
                <label for="one">1</label>
                <br>
                <input type="radio" name="rating" id="two" value="two">
                <label for="two">2</label>
                <br>
                <input type="radio" name="rating" id="three" value="three">
                <label for="three">3</label>
                <br>
                <input type="radio" name="rating" id="four" value="four">
                <label for="four">4</label>
                <br>
                <input type="radio" name="rating" id="five" value="five">
                <label for="five">5</label>
            </div>
            <br>
            <div>
                <button type="submit">Send your message!</button>
            </div>
        </form>
    </div>
</body>

</html>
